{{ define "main" }}
<p class="back"><a href="{{ "" | relURL }}">← Trang chủ</a></p>
<article>
    <h1 class="post-title">{{ .Title }}</h1>
    {{- if not .Date.IsZero }}
    <p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January, 2006" }}</time></p>
    {{- end }}
    <div class="prose">
        {{ .Content }}
    </div>
</article>
{{ end }}
